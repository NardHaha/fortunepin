<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortune Pin | Carry a little fortune</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#7D4A3A; --deep:#5A2E25; --orange:#F58B4C; --cream:#FDF1DE; --peach:#F9B493;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;line-height:1.5;min-height:100vh}
main{max-width:30rem;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.ears{display:flex;justify-content:space-between;padding:0 12%;margin-bottom:-1.1rem;position:relative;z-index:0}
.ear{width:4.2rem;height:4.6rem;background:var(--orange);border:.45rem solid var(--deep);border-bottom:0;border-radius:90% 10% 0 0;position:relative}
.ear::after{content:"";position:absolute;inset:.9rem .7rem 0;background:var(--peach);border-radius:90% 10% 0 0}
.ear.r{transform:scaleX(-1)}
h1{position:relative;z-index:1;margin:0;text-align:center;font-weight:700;font-size:clamp(2.6rem,14vw,3.8rem);line-height:.95;color:var(--orange);
  -webkit-text-stroke:.5rem var(--deep);paint-order:stroke fill;text-shadow:0 .25rem 0 var(--deep);letter-spacing:.02em}
.tag{display:block;width:max-content;max-width:100%;margin:1rem auto 0;background:var(--cream);color:var(--orange);font-weight:700;padding:.3rem .9rem;border-radius:.6rem;text-align:center}
.lead{text-align:center;margin:1.5rem 0 1rem;color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:1.25rem}
.chip{font:inherit;font-weight:500;color:var(--cream);background:transparent;border:.15rem solid var(--peach);border-radius:2rem;padding:.4rem .95rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--deep);border-color:var(--cream)}
.card{background:var(--cream);color:var(--deep);border-radius:1.4rem;border:.3rem solid var(--deep);box-shadow:0 .4rem 0 var(--deep);padding:1.5rem 1.4rem;min-height:11rem;display:flex;flex-direction:column;justify-content:center;gap:.7rem}
.kind{font-weight:600;color:var(--orange);margin:0}
.text{font-size:1.35rem;font-weight:500;line-height:1.4;margin:0}
.src{margin:0;font-weight:500;opacity:.8}
.card.pop{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.96)}to{transform:scale(1)}}
.draw{display:block;width:100%;margin-top:1.25rem;font:inherit;font-weight:700;font-size:1.25rem;color:var(--deep);background:var(--orange);border:.3rem solid var(--deep);border-radius:1.2rem;box-shadow:0 .35rem 0 var(--deep);padding:.9rem;cursor:pointer}
.draw:active{transform:translateY(.25rem);box-shadow:0 .1rem 0 var(--deep)}
.songs{margin-top:2.25rem}
.songs h2{font-size:1.35rem;margin:0 0 .6rem;color:var(--peach)}
.songs ul{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.songs a{display:block;background:var(--deep);color:var(--cream);text-decoration:none;border-radius:.9rem;padding:.7rem 1rem}
.songs a span{display:block;opacity:.75;font-size:.95rem}
footer{margin-top:2.25rem;text-align:center;opacity:.8;font-size:.95rem}
.chip:focus-visible,.draw:focus-visible,.songs a:focus-visible{outline:.2rem solid var(--cream);outline-offset:.2rem}
@media (prefers-reduced-motion:reduce){.card.pop{animation:none}}
</style>
</head>
<body>
<main>
  <div class="ears" aria-hidden="true"><div class="ear"></div><div class="ear r"></div></div>
  <h1>Fortune<br>Pin</h1>
  <span class="tag">Carry a little fortune</span>

  <p class="lead">Pick what you need today, then draw your fortune.</p>

  <div class="chips" role="group" aria-label="Choose a category">
    <button class="chip" data-k="all" aria-pressed="true">Surprise me</button>
    <button class="chip" data-k="quote" aria-pressed="false">Quotes</button>
    <button class="chip" data-k="verse" aria-pressed="false">Bible verses</button>
    <button class="chip" data-k="affirm" aria-pressed="false">Affirmations</button>
  </div>

  <section class="card" id="card" aria-live="polite">
    <p class="kind" id="kind">Your fortune</p>
    <p class="text" id="text">Tap the button below to draw today's message.</p>
    <p class="src" id="src"></p>
  </section>

  <button class="draw" id="draw">Draw my fortune</button>

  <section class="songs">
    <h2>Songs to lift your mood</h2>
    <ul id="songs"></ul>
  </section>

  <footer>Scan again anytime you need good luck and good vibes.</footer>
</main>

<script>
var F = [
  {k:"quote",t:"You don't have to be perfect today. Showing up is already a win."},
  {k:"quote",t:"Small steps still move you forward."},
  {k:"quote",t:"Rest if you must, but don't quit."},
  {k:"quote",t:"Hard days make the good days feel even better."},
  {k:"quote",t:"Your effort is planting seeds. Keep watering them."},
  {k:"quote",t:"Be proud of how far you've come, not just how far you have to go."},
  {k:"verse",t:"I can do all things through Christ which strengtheneth me.",s:"Philippians 4:13 (KJV)"},
  {k:"verse",t:"Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.",s:"Joshua 1:9 (KJV)"},
  {k:"verse",t:"Fear thou not; for I am with thee: be not dismayed; for I am thy God.",s:"Isaiah 41:10 (KJV)"},
  {k:"verse",t:"Trust in the LORD with all thine heart; and lean not unto thine own understanding.",s:"Proverbs 3:5 (KJV)"},
  {k:"verse",t:"Casting all your care upon him; for he careth for you.",s:"1 Peter 5:7 (KJV)"},
  {k:"affirm",t:"I am capable, and I am learning every day."},
  {k:"affirm",t:"Good things are coming my way."},
  {k:"affirm",t:"I can handle today, one task at a time."},
  {k:"affirm",t:"I am allowed to take a breath and start again."},
  {k:"affirm",t:"I bring good energy wherever I go."}
];
var L = {quote:"Motivational quote",verse:"Bible verse",affirm:"Affirmation"};
var S = [
  ["Count on Me","Bruno Mars"],
  ["Lovely Day","Bill Withers"],
  ["Three Little Birds","Bob Marley"],
  ["Bawat Piyesa","Munimuni"]
];
var cat="all", last=-1;
var card=document.getElementById("card");

document.getElementById("songs").innerHTML = S.map(function(s){
  var q=encodeURIComponent(s[0]+" "+s[1]);
  return '<li><a href="https://open.spotify.com/search/'+q+'" target="_blank" rel="noopener">'+s[0]+'<span>'+s[1]+'</span></a></li>';
}).join("");

document.querySelectorAll(".chip").forEach(function(b){
  b.addEventListener("click",function(){
    cat=b.dataset.k;
    document.querySelectorAll(".chip").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false")});
    draw();
  });
});
document.getElementById("draw").addEventListener("click",draw);

function draw(){
  var pool=F.filter(function(f){return cat==="all"||f.k===cat});
  var i;
  do{ i=Math.floor(Math.random()*pool.length) }while(pool.length>1 && pool[i]===F[last]);
  var f=pool[i]; last=F.indexOf(f);
  document.getElementById("kind").textContent=L[f.k];
  document.getElementById("text").textContent=f.t;
  document.getElementById("src").textContent=f.s||"";
  card.classList.remove("pop"); void card.offsetWidth; card.classList.add("pop");
}
</script>
</body>
</html>
